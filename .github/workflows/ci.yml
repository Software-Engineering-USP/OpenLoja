name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t openloja:ci .

      - name: Smoke test
        run: |
          docker run -d --name openloja -p 8000:8000 -e SECRET_KEY=ci openloja:ci
          for i in $(seq 30); do
            curl -fs -o /dev/null http://localhost:8000/ && exit 0
            sleep 1
          done
          docker logs openloja
          exit 1
