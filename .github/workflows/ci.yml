name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # versão mínima (pyproject.toml) e a da imagem Docker
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # --locked falha se o uv.lock estiver desatualizado em relação ao pyproject.toml
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Tests
        run: uv run pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t openloja:ci .

      - name: Smoke test
        run: |
          docker run -d --name openloja -p 8000:8000 -e SECRET_KEY=ci openloja:ci
          for i in $(seq 30); do
            curl -fs -o /dev/null http://localhost:8000/ && exit 0
            sleep 1
          done
          docker logs openloja
          exit 1
