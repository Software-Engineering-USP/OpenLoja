services:
  web:
    build: .
    image: openloja:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/database.db
    volumes:
      - db-data:/data
      - images:/code/static/images
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # `docker compose watch`: sincroniza o código e reinicia o app ao editar
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /code
          ignore:
            - static/images/
            - database.db
        - action: rebuild
          path: ./src/requirements.txt

volumes:
  db-data:
  images:
